const map = L.map('map');
L.tileLayer(TILE_URL, { maxZoom: 19, attribution: TILE_ATTR }).addTo(map);

// ===== 4. 점수 → 색상 변환 (노랑~빨강 사이를 부드럽게 섞음) =====
function getColor(score) {
  let t = (score - SCORE_MIN) / (SCORE_MAX - SCORE_MIN);
  t = Math.max(0, Math.min(1, t));
  const rgb = COLOR_LOW.map((low, i) => Math.round(low + (COLOR_HIGH[i] - low) * t));
  return 'rgb(' + rgb.join(',') + ')';
}

function fmt(v, digits) {
  return (v === null || v === undefined) ? '-' : v.toFixed(digits);
}

// ===== 5. 점(원) 만들기 =====
const group = L.layerGroup().addTo(map);   // 지도에 실제로 보이는 점들
const markers = [];                        // 전체 점 보관용

DATA.features.forEach(function (f) {
  const p = f.properties;
  const score = p['적합도점수'];
  if (score === null) return;              // 점수 없는 격자는 제외

  const lng = f.geometry.coordinates[0];
  const lat = f.geometry.coordinates[1];

  const m = L.circleMarker([lat, lng], {
    radius: POINT_RADIUS,
    fillColor: getColor(score),
    color: '#555', weight: 1, fillOpacity: 0.85
  });
  m.bindPopup(
    '<b>입지 적합도: ' + score.toFixed(3) + '</b><br>' +
    '인구밀도: ' + fmt(p['인구밀도'], 0) + ' 명/㎢<br>' +
    '대피소까지 거리: ' + fmt(p['대피소거리'], 0) + ' m<br>' +
    '도로까지 거리: ' + fmt(p['도로거리'], 0) + ' m'
  );
  m._score = score;
  markers.push(m);
});

// 점들이 모두 보이도록 지도 범위 맞추기
map.fitBounds(L.latLngBounds(markers.map(function (m) { return m.getLatLng(); })));

// ===== 6. 오른쪽 위: 적합도 필터 슬라이더 =====
const filterControl = L.control({ position: 'topright' });
filterControl.onAdd = function () {
  const div = L.DomUtil.create('div', 'panel');
  div.style.width = '220px';
  div.innerHTML =
    '<div class="panel-title">적합도 필터</div>' +
    '<div>적합도 <b>≥ <span id="thLabel">' + SCORE_MIN.toFixed(2) + '</span></b> 만 표시</div>' +
    '<input id="thSlider" type="range" style="width:100%" ' +
      'min="' + SCORE_MIN + '" max="' + SCORE_MAX + '" step="0.01" value="' + SCORE_MIN + '">' +
    '<div style="font-size:12px;color:#555;">표시 중: <b id="cntLabel">0</b> / ' + markers.length + '개</div>';
  // 슬라이더를 움직일 때 지도가 같이 끌려가지 않도록 막기
  L.DomEvent.disableClickPropagation(div);
  L.DomEvent.disableScrollPropagation(div);
  return div;
};
filterControl.addTo(map);

function updateFilter(threshold) {
  group.clearLayers();
  let count = 0;
  markers.forEach(function (m) {
    if (m._score >= threshold) { group.addLayer(m); count++; }
  });
  document.getElementById('thLabel').textContent = threshold.toFixed(2);
  document.getElementById('cntLabel').textContent = count;
}

document.getElementById('thSlider').addEventListener('input', function (e) {
  updateFilter(parseFloat(e.target.value));
});
updateFilter(SCORE_MIN);   // 처음엔 전부 표시

// ===== 7. 오른쪽 아래: 범례 =====
const legend = L.control({ position: 'bottomright' });
legend.onAdd = function () {
  const div = L.DomUtil.create('div', 'panel');
  const mid = (SCORE_MIN + SCORE_MAX) / 2;
  div.innerHTML =
    '<div class="panel-title">입지 적합도</div>' +
    '<div class="legend-bar" style="background: linear-gradient(to right, ' +
      getColor(SCORE_MIN) + ', ' + getColor(SCORE_MAX) + ');"></div>' +
    '<div class="legend-labels"><span>' + SCORE_MIN + ' (낮음)</span><span>' + mid +
      '</span><span>' + SCORE_MAX + ' (높음)</span></div>';
  return div;
};
legend.addTo(map);
</script>
</body>
</html>
